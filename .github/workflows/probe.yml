name: Probe TorBox API
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Official API collection (api-docs.torbox.app)
        run: |
          curl -sL --max-time 30 "https://api-docs.torbox.app/api/collections/29572726/2s9YXo1zX4?environment=29572726-1b0d18ed-d45c-43f1-ad3f-253c7d41f915&segregateAuth=true&versionTag=latest" -o col.json
          wc -c col.json; jq -r 'keys' col.json | tr -d '\n'; echo
          # One line per request: folder path, method, url, query keys, body keys
          jq -r '
            def walk_items(p): .[] | if .item then (.item | walk_items(p + [.name])) else {p: (p|join(" / ")), n: .name, r: .request} end;
            (.item // .collection.item) | walk_items([]) |
            "\(.p) | \(.n) | \(.r.method) \((.r.url.raw // .r.url // "") | tostring | sub("\\{\\{[a-z_]+\\}\\}";"")) | q=\([.r.url.query[]?.key] | join(",")) | b=\(.r.body.mode // "-"):\(([.r.body.formdata[]?.key] + [.r.body.urlencoded[]?.key]) | join(","))\(.r.body.raw // "" | gsub("\\s+";" ") | .[0:160])"
          ' col.json
      - name: Descriptions of selected endpoints
        run: |
          jq -r '
            def walk_items: .[] | if .item then (.item | walk_items) else . end;
            (.item // .collection.item) | walk_items |
            select(.name | test("Control|Search|Settings|Edit|Stream|Subscription|Transaction|Device|Engine|Vendor|Integration|Usenet Download|Web Download|Create Torrent|Queued"; "i")) |
            "### \(.name)\n\((.request.description // "") | tostring | gsub("\\s+";" ") | .[0:900])\n"
          ' col.json | head -c 60000
      - name: Live response shapes
        run: |
          curl -s --max-time 20 https://api.torbox.app/v1/api/changelogs/json | jq -c '.data[0] | with_entries(.value |= (tostring | .[0:40]))'
