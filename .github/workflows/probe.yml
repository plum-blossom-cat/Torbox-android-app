name: Probe TorBox API
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Docs site
        run: |
          curl -sL --max-time 25 https://api-docs.torbox.app/ -o docs.html; wc -c docs.html
          grep -oE '(href|src)="[^"]+"' docs.html | head -40
          grep -oiE '[a-z0-9/_.-]*(openapi|swagger|spec)[a-z0-9/_.-]*\.(json|yaml|yml)' docs.html | sort -u | head
          for u in openapi.json swagger.json api/openapi.json docs/openapi.json openapi.yaml llms.txt llms-full.txt sitemap.xml; do printf "%s " $u; curl -s --max-time 15 -o /dev/null -w "%{http_code} %{content_type}\n" https://api-docs.torbox.app/$u; done
      - name: llms.txt
        run: curl -sL --max-time 25 https://api-docs.torbox.app/llms.txt | head -c 6000; echo
      - name: Live unauthenticated endpoints
        run: |
          j(){ echo "=== $1"; curl -sL --max-time 25 "$1" | head -c ${2:-1500}; echo; }
          j https://api.torbox.app/
          j https://api.torbox.app/v1/api/stats
          j https://api.torbox.app/v1/api/changelogs/json 1200
          j "https://api.torbox.app/v1/api/speedtest?test_length=short" 2500
          j "https://api.torbox.app/v1/api/torrents/torrentinfo?hash=dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c&timeout=10" 1500
          j https://api.torbox.app/v1/api/webdl/hosters 1200
          j https://api.torbox.app/v1/api/user/me 400
          j https://search-api.torbox.app/ 800
          j "https://search-api.torbox.app/torrents/search/sintel?metadata=true" 600
