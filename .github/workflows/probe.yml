name: Probe dependency versions
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable versions
        run: |
          g() { curl -sL "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|rc|dev' | tail -4 | tr '\n' ' '; echo " <= $1"; }
          c() { curl -sL "https://repo1.maven.org/maven2/$1/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|rc|dev|RC|Beta' | tail -4 | tr '\n' ' '; echo " <= $1"; }
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/compose/material3/material3 androidx/activity/activity-compose androidx/core/core-ktx androidx/lifecycle/lifecycle-runtime-compose androidx/navigation/navigation-compose androidx/datastore/datastore-preferences androidx/work/work-runtime-ktx androidx/browser/browser androidx/core/core-splashscreen androidx/test/ext/junit androidx/compose/ui/ui-test-junit4 androidx/compose/material/material-icons-extended; do g $a; done
          for a in org/jetbrains/kotlin/kotlin-gradle-plugin org/jetbrains/kotlinx/kotlinx-serialization-json org/jetbrains/kotlinx/kotlinx-coroutines-android com/squareup/okhttp3/okhttp io/coil-kt/coil3/coil-compose org/robolectric/robolectric io/github/takahirom/roborazzi/roborazzi com/composables/icons-lucide com/composables/icons-lucide-android; do c $a; done
          echo; echo "AGP 8.13 / 9.x release info:"; curl -sL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>(8\.1[2-9]|9\.)[^<]+' | tr '\n' ' '
          echo; echo "BOM 2025+:"; curl -sL https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/maven-metadata.xml | grep -oE '<version>202[5-6][^<]+' | tr '\n' ' '
