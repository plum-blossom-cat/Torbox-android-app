name: Probe TorBox API
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch collection
        run: |
          curl -sL --max-time 30 "https://api-docs.torbox.app/api/collections/29572726/2s9YXo1zX4?environment=29572726-1b0d18ed-d45c-43f1-ad3f-253c7d41f915&segregateAuth=true&versionTag=latest" -o col.json
          jq -r '.info.description // "" | gsub("\\s+";" ") | .[0:1500]' col.json
          jq -r '.item[] | "FOLDER: \(.name) (\(.item | length? // 0))"' col.json
          grep -o 'search-api[^"\\ ]*' col.json | sort -u | head
          grep -oi 'integration/[a-z0-9_/]*' col.json | sort -u | head -30
      - name: Bodies and response examples
        run: |
          jq -r '
            def walk_items: .[] | if .item then (.item | walk_items) else . end;
            .item | walk_items |
            select(.name | test("^(Edit User Settings|Get User Data|Start Device Code|Get Token From Device|Get Referral Data|Get Subscriptions|Get Transactions|Get User Stats|Create Stream|Get Stream Data|Get News Server|Reset News Server|Edit Torrent Item|Get Torrent List|Get Usenet List|Get Web Download List|Get Notification Feed|Get All Jobs|Get Queued Downloads|Get User RSS Feeds|Get RSS Feed Items|Control Usenet Download|Control Torrent|Create Torrent|Get Torrent Cached Availability$|Request Download Link)")) |
            "######## \(.name)\nBODY: \((.request.body.raw // "") | gsub("\\s+";" ") | .[0:2500])\n" +
            ([.response[]? | "-- example \(.name) [\(.code)]: \((.body // "") | gsub("\\s+";" ") | .[0:1800])"] | .[0:2] | join("\n"))
          ' col.json
